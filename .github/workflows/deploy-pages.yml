name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "functions/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy lab/ → Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy lab --project-name=ai-drives-crazy
