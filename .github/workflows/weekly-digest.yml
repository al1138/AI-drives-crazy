name: Weekly digest

# Chaque lundi 07:00 UTC → Cloudflare /api/digest
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly mail via Cloudflare
        env:
          DIGEST_URL: ${{ vars.DIGEST_URL }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
        run: |
          URL="${DIGEST_URL:-https://ai-drives-crazy.pages.dev/api/digest}"
          if [ -z "$DIGEST_SECRET" ]; then
            echo "Ajoute le secret GitHub DIGEST_SECRET (même valeur que sur Cloudflare)."
            exit 1
          fi
          curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $DIGEST_SECRET" \
            -H "content-type: application/json" \
            --fail-with-body
